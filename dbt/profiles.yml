enterprise_lakehouse:
  target: dev
  outputs:
    dev:
      type: trino
      method: none
      host: trino
      port: 8080
      database: iceberg
      schema: silver
      user: admin
      threads: 4
      http_scheme: http
      session_properties:
        query_max_run_time: "60m"
        exchange_compression: true
