version: 2

models:
  - name: gold_oee_dashboard
    columns:
      - name: machine_id
        tests:
          - not_null
      - name: hour_window
        tests:
          - not_null

  - name: gold_batch_summary
    columns:
      - name: batch_id
        tests:
          - not_null
          - unique
      - name: batch_status
        tests:
          - accepted_values:
              values: ['RELEASED', 'REJECTED', 'UNDER_REVIEW']

  - name: gold_quality_kpis
    columns:
      - name: report_date
        tests:
          - not_null
      - name: product_code
        tests:
          - not_null

  - name: gold_production_efficiency
    columns:
      - name: week_start
        tests:
          - not_null
      - name: line_id
        tests:
          - not_null
      - name: efficiency_category
        tests:
          - accepted_values:
              values: ['HIGH', 'MEDIUM', 'LOW']
      - name: trend_vs_prior_week
        tests:
          - accepted_values:
              values: ['IMPROVING', 'DECLINING', 'STABLE']

  - name: gold_manufacturing_oee_mart
    columns:
      - name: machine_id
        tests:
          - not_null
      - name: production_date
        tests:
          - not_null

  - name: gold_compliance_capa_mart
    columns:
      - name: department
        tests:
          - not_null
      - name: compliance_rag_status
        tests:
          - accepted_values:
              values: ['GREEN', 'AMBER', 'RED']

  - name: gold_quality_risk_mart
    columns:
      - name: product_code
        tests:
          - not_null
      - name: batch_number
        tests:
          - not_null
      - name: risk_rag_status
        tests:
          - accepted_values:
              values: ['GREEN', 'AMBER', 'RED']

  - name: gold_sap_inventory_mart
    columns:
      - name: material_code
        tests:
          - not_null
      - name: plant
        tests:
          - not_null

  - name: gold_training_compliance_mart
    columns:
      - name: department
        tests:
          - not_null
      - name: completion_rate_pct
        tests:
          - not_null
