version: 2

models:
  - name: silver_mes_events
    columns:
      - name: event_id
        tests:
          - not_null
          - unique
      - name: batch_id
        tests:
          - not_null
      - name: status
        tests:
          - accepted_values:
              values: ['PASS', 'FAIL', 'WARNING']

  - name: silver_quality_events
    columns:
      - name: deviation_id
        tests:
          - not_null
          - unique
      - name: batch_id
        tests:
          - not_null
          - relationships:
              to: ref('silver_mes_events')
              field: batch_id
      - name: status
        tests:
          - accepted_values:
              values: ['OPEN', 'IN_REVIEW', 'CLOSED']
      - name: severity
        tests:
          - accepted_values:
              values: ['CRITICAL', 'MAJOR', 'MINOR']

  - name: silver_production_orders
    columns:
      - name: order_id
        tests:
          - not_null
          - unique
      - name: batch_id
        tests:
          - not_null
      - name: product_code
        tests:
          - relationships:
              to: ref('silver_mes_events')
              field: product_code
      - name: status
        tests:
          - accepted_values:
              values: ['PLANNED', 'IN_PROGRESS', 'COMPLETE', 'DELAYED']
      - name: production_efficiency
        tests:
          - accepted_values:
              values: ['HIGH', 'MEDIUM', 'LOW']

  - name: silver_iqms_deviations
    columns:
      - name: deviation_id
        tests:
          - not_null
          - unique
      - name: severity
        tests:
          - accepted_values:
              values: ['CRITICAL', 'MAJOR', 'MINOR']

  - name: silver_iqms_quality_tests
    columns:
      - name: test_id
        tests:
          - not_null
          - unique
      - name: result
        tests:
          - accepted_values:
              values: ['PASS', 'FAIL']

  - name: silver_mes_production_orders
    columns:
      - name: order_id
        tests:
          - not_null
          - unique
      - name: status
        tests:
          - accepted_values:
              values: ['COMPLETED', 'IN_PROGRESS', 'ON_HOLD']

  - name: silver_trackwise_capas
    columns:
      - name: capa_id
        tests:
          - not_null
          - unique
      - name: status
        tests:
          - accepted_values:
              values: ['OPEN', 'IN_PROGRESS', 'COMPLETED', 'VERIFIED', 'CLOSED']

  - name: silver_sap_inventory
    columns:
      - name: material_code
        tests:
          - not_null
      - name: plant
        tests:
          - not_null

  - name: silver_tms_training
    columns:
      - name: record_id
        tests:
          - not_null
          - unique
      - name: department
        tests:
          - not_null
      - name: status
        tests:
          - accepted_values:
              values: ['COMPLETED', 'SCHEDULED', 'IN_PROGRESS', 'OVERDUE']
