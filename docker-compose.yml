
# ============================================================
# TPL Data Lakehouse - Full Stack Docker Compose
# Airgapped / On-Prem Build
# Storage Backend: SeaweedFS (S3-Compatible)
# ============================================================

x-airflow-common: &airflow-common
  build:
    context: ./dockerfiles/airflow
    dockerfile: Dockerfile
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    AIRFLOW__CORE__FERNET_KEY: "81HqDtbqAywKSOumSha3BhWNOdQ26slT6K0YaZeZyPs="
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
  volumes:
    - ./configs/airflow/dags:/opt/airflow/dags
    - ./scripts:/opt/airflow/scripts
    - ./data:/opt/airflow/data
    - ./dbt:/opt/airflow/dbt
    - ./great_expectations:/opt/airflow/great_expectations
    - airflow_logs:/opt/airflow/logs
    - airflow_plugins:/opt/airflow/plugins
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - lakehouse_net

x-spark-common: &spark-common
  image: bitnami/spark:3.4
  environment:
    - SPARK_MODE=worker
    - SPARK_MASTER_URL=spark://spark-master:7077
    - SPARK_WORKER_MEMORY=2G
    - SPARK_WORKER_CORES=2
    - SPARK_EXTRA_CLASSPATH=/opt/bitnami/spark/jars/*
  volumes:
    - ./configs/spark/spark-defaults.conf:/opt/bitnami/spark/conf/spark-defaults.conf
    - spark_jars:/opt/bitnami/spark/jars
  networks:
    - lakehouse_net

networks:
  lakehouse_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/16

volumes:
  postgres_data:
  seaweedfs_master:
  seaweedfs_volume:
  seaweedfs_filer:
  kafka_data:
  zookeeper_data:
  zookeeper_log:
  nifi_conf:
  nifi_content:
  nifi_database:
  nifi_flowfile:
  nifi_provenance:
  spark_jars:
  airflow_logs:
  airflow_plugins:
  datahub_mysql:
  loki_data:
  superset_data:
  jupyterhub_data:
  prometheus_data:
  grafana_data:
  milvus_data:
  ollama_data:
  elasticsearch_data:
  opensearch_data:
  gitlab_config:
  gitlab_logs:
  gitlab_data:
  trino_data:
  openBao_data:

services:

  # ============================================================
  # INFRASTRUCTURE - PostgreSQL (shared metastore DB)
  # ============================================================
  postgres:
    image: postgres:13
    container_name: lakehouse_postgres
    profiles: ["core", "all"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-postgres.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "admin"]
      interval: 10s
      retries: 5
    networks:
      lakehouse_net:
        aliases:
          - postgres

  # ============================================================
  # INFRASTRUCTURE - SeaweedFS (S3-Compatible Object Storage)
  # ============================================================
  seaweedfs-master:
    image: chrislusf/seaweedfs:3.63
    container_name: lakehouse_seaweedfs_master
    profiles: ["core", "all"]
    restart: unless-stopped
    command: "master -ip=seaweedfs-master -ip.bind=0.0.0.0 -port=9333 -mdir=/data"
    volumes:
      - seaweedfs_master:/data
    ports:
      - "9333:9333"
      - "19333:19333"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9333/cluster/status"]
      interval: 10s
      retries: 5
    networks:
      lakehouse_net:
        aliases:
          - seaweedfs-master

  seaweedfs-volume:
    image: chrislusf/seaweedfs:3.63
    container_name: lakehouse_seaweedfs_volume
    profiles: ["core", "all"]
    restart: unless-stopped
    command: "volume -ip.bind=0.0.0.0 -ip=seaweedfs-volume -mserver=seaweedfs-master:9333 -port=8082 -dir=/data -max=100"
    volumes:
      - seaweedfs_volume:/data
    ports:
      - "8082:8082"
    depends_on:
      seaweedfs-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8082/status"]
      interval: 10s
      retries: 5
    networks:
      lakehouse_net:
        aliases:
          - seaweedfs-volume

  seaweedfs-filer:
    image: chrislusf/seaweedfs:3.63
    container_name: lakehouse_seaweedfs_filer
    profiles: ["core", "all"]
    restart: unless-stopped
    command: "filer -ip.bind=0.0.0.0 -ip=seaweedfs-filer -master=seaweedfs-master:9333 -port=8888"
    volumes:
      - seaweedfs_filer:/data
    ports:
      - "8888:8888"
    depends_on:
      seaweedfs-volume:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8888/"]
      interval: 10s
      retries: 5
    networks:
      lakehouse_net:
        aliases:
          - seaweedfs-filer

  seaweedfs-s3:
    image: chrislusf/seaweedfs:3.63
    container_name: lakehouse_seaweedfs_s3
    profiles: ["core", "all"]
    restart: unless-stopped
    command: "s3 -ip.bind=0.0.0.0 -filer=seaweedfs-filer:8888 -port=8333 -config=/etc/seaweedfs/s3.json"
    volumes:
      - ./configs/seaweedfs/s3.json:/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"
    depends_on:
      seaweedfs-filer:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8333/ || exit 0"]
      interval: 10s
      retries: 5
    networks:
      lakehouse_net:
        aliases:
          - seaweedfs-s3

  # SeaweedFS bucket initializer
  seaweedfs-init:
    image: amazon/aws-cli:2.15.0
    container_name: lakehouse_seaweedfs_init
    profiles: ["core", "all"]
    environment:
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY:-admin}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_KEY:-admin123}
    entrypoint: /bin/sh
    command: /scripts/init-seaweedfs.sh
    volumes:
      - ./scripts/init-seaweedfs.sh:/scripts/init-seaweedfs.sh
    depends_on:
      seaweedfs-s3:
        condition: service_healthy
    networks:
      - lakehouse_net

  # ============================================================
  # DATA INGESTION - Zookeeper + Kafka
  # ============================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: lakehouse_zookeeper
    profiles: ["ingestion", "all"]
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 10s
      retries: 5
    networks:
      lakehouse_net:
        aliases:
          - zookeeper

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: lakehouse_kafka
    profiles: ["ingestion", "all"]
    restart: unless-stopped
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    ports:
      - "9092:9092"
      - "29092:29092"
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 20s
      retries: 10
      start_period: 30s
    networks:
      lakehouse_net:
        aliases:
          - kafka

  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    container_name: lakehouse_schema_registry
    profiles: ["ingestion", "all"]
    restart: unless-stopped
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    ports:
      - "8081:8081"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8081/subjects"]
      interval: 15s
      retries: 5
    networks:
      lakehouse_net:
        aliases:
          - schema-registry

  kafka-connect:
    image: confluentinc/cp-kafka-connect:7.5.0
    container_name: lakehouse_kafka_connect
    profiles: ["ingestion", "all"]
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:9092
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: lakehouse-connect
      CONNECT_CONFIG_STORAGE_TOPIC: docker-connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: docker-connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: docker-connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
    volumes:
      - ./configs/kafka-connect/connectors:/etc/kafka-connect/connectors
    ports:
      - "8083:8083"
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_started
    command:
      - bash
      - -c
      - |
        confluent-hub install --no-prompt debezium/debezium-connector-mysql:2.4.2
        confluent-hub install --no-prompt debezium/debezium-connector-postgresql:2.4.2
        confluent-hub install --no-prompt debezium/debezium-connector-sqlserver:2.4.2
        confluent-hub install --no-prompt confluentinc/kafka-connect-s3:12.1.4
        /etc/confluent/docker/run
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8083/connectors"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      lakehouse_net:
        aliases:
          - kafka-connect

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: lakehouse_kafka_ui
    profiles: ["ingestion", "all"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
    ports:
      - "9000:8080"
      - "9021:8080"
    depends_on:
      - kafka
    networks:
      - lakehouse_net

  # Apache NiFi (OPC-UA / File ingestion)
  nifi:
    image: apache/nifi:1.23.2
    container_name: lakehouse_nifi
    profiles: ["ingestion", "all"]
    environment:
      NIFI_WEB_HTTP_PORT: 8090
      NIFI_CLUSTER_IS_NODE: "false"
      SINGLE_USER_CREDENTIALS_USERNAME: ${NIFI_USER:-admin}
      SINGLE_USER_CREDENTIALS_PASSWORD: ${NIFI_PASS:-adminadminadmin}
    volumes:
      - ./data:/opt/nifi/data
      - nifi_conf:/opt/nifi/nifi-current/conf
      - nifi_content:/opt/nifi/nifi-current/content_repository
      - nifi_database:/opt/nifi/nifi-current/database_repository
      - nifi_flowfile:/opt/nifi/nifi-current/flowfile_repository
      - nifi_provenance:/opt/nifi/nifi-current/provenance_repository
    ports:
      - "8090:8090"
    networks:
      - lakehouse_net

  # ============================================================
  # PROCESSING & TRANSFORMATION - Spark
  # ============================================================
  spark-master:
    image: bitnami/spark:3.4
    container_name: lakehouse_spark_master
    profiles: ["processing", "all"]
    restart: unless-stopped
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_HOST=spark-master
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8181
      - SPARK_EXTRA_CLASSPATH=/opt/bitnami/spark/jars/*
    volumes:
      - ./scripts:/opt/lakehouse/scripts
      - ./data:/opt/lakehouse/data
      - ./configs/spark/spark-defaults.conf:/opt/bitnami/spark/conf/spark-defaults.conf
      - spark_jars:/opt/bitnami/spark/jars
    ports:
      - "7077:7077"
      - "8181:8181"
      - "8998:8181"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/8181'"]
      interval: 15s
      retries: 5
      start_period: 30s
    networks:
      lakehouse_net:
        aliases:
          - spark-master

  spark-worker-1:
    <<: *spark-common
    container_name: lakehouse_spark_worker_1
    profiles: ["processing", "all"]
    ports:
      - "8182:8182"
    depends_on:
      - spark-master

  spark-worker-2:
    <<: *spark-common
    container_name: lakehouse_spark_worker_2
    profiles: ["processing", "all"]
    ports:
      - "8183:8183"
    depends_on:
      - spark-master

  # Apache Airflow
  redis:
    image: redis:7-alpine
    container_name: lakehouse_redis
    profiles: ["processing", "all"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5
    networks:
      - lakehouse_net

  airflow-init:
    <<: *airflow-common
    container_name: lakehouse_airflow_init
    profiles: ["processing", "all"]
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db init
        airflow users create --username admin --password admin \
          --firstname Admin --lastname User --role Admin --email admin@lakehouse.local
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: lakehouse_airflow_web
    profiles: ["processing", "all"]
    command: webserver
    ports:
      - "8280:8080"
      - "8793:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: lakehouse_airflow_scheduler
    profiles: ["processing", "all"]
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-worker:
    <<: *airflow-common
    container_name: lakehouse_airflow_worker
    profiles: ["processing", "all"]
    command: celery worker
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # dbt Core (run via Airflow or standalone)
  dbt:
    build:
      context: ./dockerfiles/dbt
      dockerfile: Dockerfile
    container_name: lakehouse_dbt
    profiles: ["processing", "all"]
    entrypoint: ["tail", "-f", "/dev/null"]
    volumes:
      - ./dbt:/usr/app/dbt
    working_dir: /usr/app/dbt
    networks:
      - lakehouse_net

  great-expectations:
    build:
      context: ./dockerfiles/great-expectations
      dockerfile: Dockerfile
    container_name: lakehouse_great_expectations
    profiles: ["processing", "all"]
    entrypoint: ["tail", "-f", "/dev/null"]
    volumes:
      - ./:/workspace
    working_dir: /workspace
    environment:
      TRINO_HOST: trino
      TRINO_PORT: 8080
      TRINO_CATALOG: iceberg
      TRINO_SCHEMA: silver
      TRINO_USER: admin
    networks:
      - lakehouse_net

  # Apache Tika (content extraction)
  tika:
    image: apache/tika:3.0.0.0
    container_name: lakehouse_tika
    profiles: ["processing", "all"]
    ports:
      - "9998:9998"
    networks:
      - lakehouse_net

  # Tesseract OCR (PDF OCR)
  tesseract:
    image: bitnami/spark:3.4
    container_name: lakehouse_tesseract
    profiles: ["processing", "all"]
    entrypoint: ["tail", "-f", "/dev/null"]
    ports:
      - "3001:3000"
    networks:
      - lakehouse_net

  # ============================================================
  # DATA LAKEHOUSE - Hive Metastore + Trino + Iceberg
  # ============================================================
  hive-metastore:
    build:
      context: ./dockerfiles/hive-metastore
      dockerfile: Dockerfile
    container_name: lakehouse_hive_metastore
    profiles: ["lakehouse", "all"]
    restart: unless-stopped
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres:5432/hive_metastore
        -Djavax.jdo.option.ConnectionUserName=admin
        -Djavax.jdo.option.ConnectionPassword=admin123
      SKIP_SCHEMA_INIT: "true"
      HIVE_CONF_DIR: /opt/hive/conf
    entrypoint: ["/bin/bash", "/hive-init.sh"]
    volumes:
      - ./configs/hive/hive-site.xml:/opt/hive/conf/hive-site.xml
      - ./scripts/hive-init.sh:/hive-init.sh
    ports:
      - "9083:9083"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      lakehouse_net:
        aliases:
          - hive-metastore

  trino:
    image: trinodb/trino:435
    container_name: lakehouse_trino
    profiles: ["lakehouse", "all"]
    restart: unless-stopped
    volumes:
      - ./configs/trino/config.properties:/etc/trino/config.properties
      - ./configs/trino/jvm.config:/etc/trino/jvm.config
      - ./configs/trino/node.properties:/etc/trino/node.properties
      - ./configs/trino/catalog/iceberg.properties:/etc/trino/catalog/iceberg.properties
      - ./configs/trino/catalog/tpch.properties:/etc/trino/catalog/tpch.properties
      - trino_data:/data/trino
    ports:
      - "8180:8080"
      - "8080:8080"
    depends_on:
      hive-metastore:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/v1/info"]
      interval: 15s
      retries: 5
      start_period: 30s
    networks:
      lakehouse_net:
        aliases:
          - trino

  # ============================================================
  # ANALYTICS & SERVING - JupyterHub + Trino already above
  # ============================================================
  jupyterhub:
    image: jupyter/datascience-notebook:latest
    container_name: lakehouse_jupyterhub
    profiles: ["analytics", "all"]
    environment:
      JUPYTERHUB_ADMIN: admin
    volumes:
      - jupyterhub_data:/srv/jupyterhub
      - ./configs/jupyterhub/jupyterhub_config.py:/srv/jupyterhub/jupyterhub_config.py
    ports:
      - "8400:8888"
    networks:
      - lakehouse_net

  # ============================================================
  # VISUALIZATION & BI - Apache Superset
  # ============================================================
  superset:
    image: apache/superset:3.1.3
    container_name: lakehouse_superset
    profiles: ["analytics", "all"]
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-supersecret123}
      DATABASE_URL: postgresql+psycopg2://admin:admin123@postgres:5432/superset
    volumes:
      - superset_data:/app/superset_home
      - ./configs/superset/superset_config.py:/app/pythonpath/superset_config.py
    ports:
      - "8500:8088"
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      bash -c "superset db upgrade &&
               superset fab create-admin --username admin --firstname Admin --lastname User --email admin@superset.local --password admin &&
               superset init &&
               superset run -h 0.0.0.0 -p 8088"
    networks:
      - lakehouse_net

  # ============================================================
  # AI & INTELLIGENT INSIGHTS - Ollama + Milvus + LangChain App
  # ============================================================
  ollama:
    image: ollama/ollama:0.1.44
    container_name: lakehouse_ollama
    profiles: ["ai", "all"]
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/11434'"]
      interval: 15s
      retries: 5
      start_period: 30s
    # GPU support: uncomment below if NVIDIA GPU available
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    networks:
      lakehouse_net:
        aliases:
          - ollama

  ollama-pull:
    image: ollama/ollama:latest
    container_name: lakehouse_ollama_pull
    profiles: ["ai", "all"]
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: /bin/sh
    command: -c "sleep 10 && ollama pull llama3"
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - lakehouse_net

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: lakehouse_milvus_etcd
    profiles: ["ai", "all"]
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >
      etcd -advertise-client-urls=http://milvus-etcd:2379
           -listen-client-urls=http://0.0.0.0:2379
           --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 15s
      retries: 5
    networks:
      lakehouse_net:
        aliases:
          - milvus-etcd

  milvus:
    image: milvusdb/milvus:v2.4.0
    container_name: lakehouse_milvus
    profiles: ["ai", "all"]
    restart: unless-stopped
    environment:
      MINIO_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY:-admin123}
      MILVUS_LOG_LEVEL: debug
    entrypoint: >
      bash -c "sleep 20 && milvus run standalone"
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      milvus-etcd:
        condition: service_healthy
      seaweedfs-s3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9091/healthz"]
      interval: 15s
      retries: 5
      start_period: 60s
    networks:
      lakehouse_net:
        aliases:
          - milvus

  # LangChain RAG + Streamlit Chat UI
  langchain-app:
    build:
      context: ./dockerfiles/langchain-app
      dockerfile: Dockerfile
    container_name: lakehouse_langchain_app
    profiles: ["ai", "all"]
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      TRINO_HOST: trino
      TRINO_PORT: 8080
    ports:
      - "8501:8501"
    depends_on:
      - ollama
      - milvus
    networks:
      - lakehouse_net

  # ============================================================
  # MONITORING & OBSERVABILITY
  # ============================================================
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: lakehouse_prometheus
    profiles: ["monitoring", "all"]
    restart: unless-stopped
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      retries: 5
    networks:
      lakehouse_net:
        aliases:
          - prometheus

  grafana:
    image: grafana/grafana:10.4.2
    container_name: lakehouse_grafana
    profiles: ["monitoring", "all"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASS:-admin123}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./configs/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      lakehouse_net:
        aliases:
          - grafana

  loki:
    image: grafana/loki:2.9.0
    container_name: lakehouse_loki
    profiles: ["monitoring", "all"]
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./configs/loki/loki-config.yml:/etc/loki/loki-config.yml
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - lakehouse_net

  promtail:
    image: grafana/promtail:2.9.0
    container_name: lakehouse_promtail
    profiles: ["monitoring", "all"]
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./configs/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml
#      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - loki
    networks:
      - lakehouse_net

  # Node Exporter - Host metrics for Prometheus
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: lakehouse_node_exporter
    profiles: ["monitoring", "all"]
    restart: unless-stopped
    command:
      - "--path.rootfs=/host"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)"
    volumes:
      - /:/host:ro
    ports:
      - "9100:9100"
    networks:
      lakehouse_net:
        aliases:
          - node-exporter

  # Postgres Exporter - PostgreSQL metrics for Prometheus
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: lakehouse_postgres_exporter
    profiles: ["monitoring", "all"]
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://admin:admin123@postgres:5432/postgres?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      lakehouse_net:
        aliases:
          - postgres-exporter

  # ============================================================
  # DATA GOVERNANCE - DataHub + OpenSearch + Apache Ranger + OpenBao
  # ============================================================
  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: lakehouse_opensearch
    profiles: ["governance", "all"]
    restart: unless-stopped
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_PASS:-Admin@123456}
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
      - "9600:9600"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9200/_cluster/health"]
      interval: 15s
      retries: 5
      start_period: 30s
    networks:
      lakehouse_net:
        aliases:
          - opensearch

  datahub-mysql:
    image: mysql:8.0
    container_name: lakehouse_datahub_mysql
    profiles: ["governance", "all"]
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASS:-datahub}
      MYSQL_DATABASE: datahub
      MYSQL_USER: datahub
      MYSQL_PASSWORD: datahub
    volumes:
      - datahub_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5
    networks:
      lakehouse_net:
        aliases:
          - datahub-mysql

  datahub-gms:
    image: acryldata/datahub-gms:v0.14.1
    container_name: lakehouse_datahub_gms
    user: "0"
    profiles: ["governance", "all"]
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - |
        set -e
        mkdir -p /metadata-models/src/main/resources
        cp /datahub/datahub-gms/resources/entity-registry.yml /metadata-models/src/main/resources/entity-registry.yml
        exec /datahub/datahub-gms/scripts/start.sh
    environment:
      DATAHUB_SERVER_TYPE: quickstart
      EBEAN_DATASOURCE_USERNAME: datahub
      EBEAN_DATASOURCE_PASSWORD: datahub
      EBEAN_DATASOURCE_HOST: datahub-mysql:3306
      EBEAN_DATASOURCE_URL: "jdbc:mysql://datahub-mysql:3306/datahub?verifyServerCertificate=false&useSSL=false&allowPublicKeyRetrieval=true&useUnicode=yes&characterEncoding=UTF-8"
      EBEAN_DATASOURCE_DRIVER: com.mysql.jdbc.Driver
      ELASTICSEARCH_HOST: opensearch
      ELASTICSEARCH_PORT: 9200
      ELASTICSEARCH_PROTOCOL: http
      KAFKA_BOOTSTRAP_SERVER: kafka:9092
      KAFKA_SCHEMAREGISTRY_URL: http://schema-registry:8081
      NEO4J_HOST: "http://datahub-neo4j:7474"
    ports:
      - "8880:8080"
    depends_on:
      datahub-mysql:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      kafka:
        condition: service_healthy
      datahub-neo4j:
        condition: service_started
    networks:
      - lakehouse_net

  datahub-neo4j:
    image: neo4j:4.4.9
    container_name: lakehouse_datahub_neo4j
    profiles: ["governance", "all"]
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/datahub
      NEO4J_dbms_default__database: graph.db
      NEO4J_dbms_allow__upgrade: "true"
    ports:
      - "7474:7474"
      - "7687:7687"
    networks:
      - lakehouse_net

  datahub-frontend:
    image: acryldata/datahub-frontend-react:v0.14.1
    container_name: lakehouse_datahub_frontend
    profiles: ["governance", "all"]
    restart: unless-stopped
    environment:
      DATAHUB_GMS_HOST: datahub-gms
      DATAHUB_GMS_PORT: "8080"
      DATAHUB_SECRET: YouKnowNothing
      DATAHUB_APP_VERSION: "1.0"
      DATAHUB_PLAY_MEM_BUFFER_SIZE: "10MB"
      KAFKA_BOOTSTRAP_SERVER: kafka:9092
      JAVA_OPTS: "-Xms512m -Xmx512m -Dhttp.port=9002 -Dconfig.file=datahub-frontend/conf/application.conf"
    ports:
      - "9002:9002"
    depends_on:
      - datahub-gms
    networks:
      - lakehouse_net

  # OpenBao (open-source Vault fork) for secrets management
  openbao:
    image: openbao/openbao:latest
    container_name: lakehouse_openbao
    profiles: ["governance", "all"]
    environment:
      BAO_ADDR: http://0.0.0.0:8200
      BAO_DEV_ROOT_TOKEN_ID: ${OPENBAO_TOKEN:-roottoken}
    command: server -dev -dev-root-token-id=${OPENBAO_TOKEN:-roottoken}
    volumes:
      - openBao_data:/data
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    networks:
      - lakehouse_net

  # ============================================================
  # CI/CD - GitLab CE
  # ============================================================
  gitlab:
    image: gitlab/gitlab-ce:16.7.0-ce.0
    container_name: lakehouse_gitlab
    profiles: ["cicd", "all"]
    hostname: gitlab.lakehouse.local
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://gitlab.lakehouse.local:8929'
        gitlab_rails['gitlab_shell_ssh_port'] = 2224
        nginx['listen_port'] = 8929
    volumes:
      - gitlab_config:/etc/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab
    ports:
      - "8929:8929"
      - "2224:22"
    shm_size: "256m"
    networks:
      lakehouse_net:
        aliases:
          - gitlab

  # ============================================================
  # ADMIN DASHBOARD - Streamlit Ops Console
  # ============================================================
  admin-dashboard:
    build:
      context: ./dockerfiles/admin-dashboard
      dockerfile: Dockerfile
    container_name: lakehouse_admin_dashboard
    profiles: ["analytics", "all"]
    environment:
      AIRFLOW_BASE_URL: http://airflow-webserver:8080
      SEAWEEDFS_ENDPOINT: http://seaweedfs-s3:8333
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TRINO_HOST: trino
      TRINO_PORT: 8080
      GRAFANA_URL: http://grafana:3000
    ports:
      - "8502:8502"
    depends_on:
      airflow-webserver:
        condition: service_healthy
    networks:
      lakehouse_net:
        aliases:
          - admin-dashboard

  # ============================================================
  # SYNTHETIC DATA GENERATOR
  # ============================================================
  synthetic-data-gen:
    build:
      context: ./synthetic_data
      dockerfile: Dockerfile
    container_name: lakehouse_synthetic_datagen
    profiles: ["synthetic", "all"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POSTGRES_HOST: postgres
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    volumes:
      - ./synthetic_data:/app
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - lakehouse_net
