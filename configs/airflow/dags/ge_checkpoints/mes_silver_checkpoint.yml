name: mes_silver_checkpoint
config_version: 1.0
class_name: Checkpoint
module_name: great_expectations.checkpoint

run_name_template: "mes_silver_%Y%m%d_%H%M%S"

validations:
  - batch_request:
      datasource_name: trino_datasource
      data_connector_name: default_inferred_data_connector
      data_asset_name: silver.silver_mes_production_orders
    expectation_suite_name: mes_silver_suite
    action_list:
      - name: store_validation_result
        action:
          class_name: StoreValidationResultAction
      - name: update_data_docs
        action:
          class_name: UpdateDataDocsAction

expectation_suite_name: mes_silver_suite
expectations:
  - expectation_type: expect_column_values_to_be_between
    kwargs:
      column: yield_pct
      min_value: 0
      max_value: 120
      mostly: 0.99

  - expectation_type: expect_column_values_to_not_be_null
    kwargs:
      column: order_id

  - expectation_type: expect_column_values_to_not_be_null
    kwargs:
      column: product_code

  - expectation_type: expect_column_values_to_be_in_set
    kwargs:
      column: status
      value_set: ["COMPLETED", "IN_PROGRESS", "ON_HOLD"]

  - expectation_type: expect_column_values_to_be_between
    kwargs:
      column: planned_qty
      min_value: 1

  - expectation_type: expect_column_values_to_not_be_null
    kwargs:
      column: _row_hash
