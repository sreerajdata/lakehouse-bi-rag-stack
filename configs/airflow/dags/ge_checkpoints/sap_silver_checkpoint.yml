# SAP Silver Layer Checkpoint — Inventory Movement Validation
name: sap_silver_checkpoint
config_version: 1.0
class_name: Checkpoint
module_name: great_expectations.checkpoint

run_name_template: "sap_silver_%Y%m%d_%H%M%S"

validations:
  - batch_request:
      datasource_name: trino_datasource
      data_connector_name: default_inferred_data_connector
      data_asset_name: silver.silver_sap_inventory
    expectation_suite_name: sap_silver_suite

expectation_suite_name: sap_silver_suite
expectations:
  # quantity must be positive
  - expectation_type: expect_column_values_to_be_between
    kwargs:
      column: quantity
      min_value: 0
      strictly: true

  # valuation_amount_inr must be non-negative
  - expectation_type: expect_column_values_to_be_between
    kwargs:
      column: valuation_amount_inr
      min_value: 0

  # posting_date must not be null
  - expectation_type: expect_column_values_to_not_be_null
    kwargs:
      column: posting_date

  # document_number must not be null
  - expectation_type: expect_column_values_to_not_be_null
    kwargs:
      column: document_number

  # movement_category must be valid
  - expectation_type: expect_column_values_to_be_in_set
    kwargs:
      column: movement_category
      value_set: ["receipt", "issue", "transfer", "scrap", "other"]

  # material_code must not be null
  - expectation_type: expect_column_values_to_not_be_null
    kwargs:
      column: material_code
