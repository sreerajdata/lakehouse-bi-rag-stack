global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: tpl-lakehouse-dev

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Kafka, Kafka Connect, Spark, Airflow, Trino, and SeaweedFS are probed by
  # service-native health checks in this compose stack. They do not expose
  # Prometheus-format metrics on their application ports unless extra exporters
  # or metric sinks are added, so scraping those ports creates false down alerts.

  - job_name: milvus
    static_configs:
      - targets: ["milvus:9091"]

  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
