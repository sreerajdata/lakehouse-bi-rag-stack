
source:
  type: airflow
  config:
    base_url: "http://airflow-webserver:8080"
    connection:
      conn_type: "postgres"
      host: "postgres"
      port: 5432
      login: "admin"
      password: "admin123"
      schema: "airflow"
    dag_pattern:
      allow:
        - "medallion_pipeline"
        - "pdf_processing_pipeline"
        - "iceberg_maintenance"
    platform_instance_map:
      trino: "tpl-lakehouse-trino"
      postgres: "tpl-lakehouse-postgres"

sink:
  type: datahub-rest
  config:
    server: "http://datahub-gms:8080"
    token: null
